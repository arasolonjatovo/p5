[project]
name = "p5"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Audrey RASOLONJATOVO", email = "rasolonjatovo.audrey@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
p5 = "p5:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
